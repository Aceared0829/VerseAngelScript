name: Automated test
permissions:
  contents: read
  
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  Linux_x86-64_GCC:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: build angelscript
      run: |
        cd $GITHUB_WORKSPACE/sdk/angelscript/projects/gnuc
        export "CXXFLAGS=-O2"
        make
    - name: build test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/projects/gnuc
        make
    - name: run test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        ./testgnuc

  Linux_x86-64_GCC_AS_DEBUG_CPP98:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: build angelscript
      run: |
        cd $GITHUB_WORKSPACE/sdk/angelscript/projects/gnuc
        export "CXXFLAGS=-DAS_DEBUG -O0 -std=c++98 -Wall -Wdeprecated -Wcast-qual -Wextra"
        make
    - name: build test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/projects/gnuc
        export "CXXFLAGS=-DAS_DEBUG -O0"
        make
    - name: run test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        ./testgnuc

  Linux_arm64_Clang_AS_USE_NAMESPACE:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
    - name: build angelscript & test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/projects/cmake
        cmake . -DCMAKE_CXX_FLAGS='-DAS_USE_NAMESPACE' -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        cmake --build . --config ${{ matrix.build_type }}
    - name: run test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        ./test_feature
        
  Windows_x86-64_Clang:      
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
    - name: set up Clang
      uses: egor-tensin/setup-clang@v1
      with:
       version: latest
       platform: x64
       cc: 1
    - name: build angelscript & test_feature
      shell: powershell
      run: |
        cd $env:GITHUB_WORKSPACE/sdk/tests/test_feature/projects/cmake
        cmake . -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        cmake --build . --config ${{ matrix.build_type }}
    - name: run test_feature
      shell: powershell
      run: |
        cd $env:GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        ./test_feature.exe

  Windows_x86-64_MSVC_CXX23:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: build VAS with MSVC C++23
      shell: powershell
      run: |
        cmake -S $env:GITHUB_WORKSPACE -B $env:RUNNER_TEMP/vasbuild-msvc-cxx23 -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build $env:RUNNER_TEMP/vasbuild-msvc-cxx23 --config Release
        ctest --test-dir $env:RUNNER_TEMP/vasbuild-msvc-cxx23 --output-on-failure -C Release
    - name: build and run full feature tests with MSVC C++23
      shell: powershell
      run: |
        $featureBuild = Join-Path $env:RUNNER_TEMP 'vas-feature-msvc-cxx23'
        cmake -S $env:GITHUB_WORKSPACE/sdk/tests/test_feature/projects/cmake -B $featureBuild -G Ninja -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS=/std:c++23preview /permissive- /Zc:__cplusplus /EHsc'
        cmake --build $featureBuild --config Release
        Push-Location $env:GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        try {
          ./test_feature.exe
        }
        finally {
          Pop-Location
        }

  Windows_x86-64_MinGW_UCRT64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
    - name: build and test VAS with native MinGW Unicode paths
      shell: msys2 {0}
      run: |
        cmake -S . -B out/mingw-unicode -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
        cmake --build out/mingw-unicode --parallel 4
        ctest --test-dir out/mingw-unicode --output-on-failure

  Rider_Plugin:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate install artifact staging
      run: python -B -m unittest discover -s tools/ide-artifacts -p test_stage.py
    - name: validate Rider project fixture
      shell: powershell
      run: python tools/rider-plugin/scripts/check-project-fixture.py
    - name: validate Rider trust evidence parser
      shell: powershell
      run: python -B -m unittest discover -s tools/rider-plugin/scripts -p test_trust_results.py
    - name: validate Rider project build evidence parser
      shell: powershell
      run: python -B -m unittest discover -s tools/rider-plugin/scripts -p test_project_build_results.py
    - name: build native tools for Rider regression tests
      shell: powershell
      run: |
        $build = Join-Path $env:RUNNER_TEMP 'vas-rider-compiler'
        cmake -S $env:GITHUB_WORKSPACE -B $build -DBUILD_TESTING=ON
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build $build --config Release --target vasbuild vas_rider_argv_fixture --parallel 4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $compiler = Join-Path $build 'Release/vasbuild.exe'
        if (-not (Test-Path $compiler)) { throw 'Missing Rider test compiler' }
        $argvFixture = Join-Path $build 'Release/vas_rider_argv_fixture.exe'
        if (-not (Test-Path $argvFixture)) { throw 'Missing Rider native argument fixture' }
        "VAS_TEST_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VAS_TEST_CONFIG=$env:GITHUB_WORKSPACE/sdk/samples/asbuild/bin/config.txt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VAS_TEST_ARGV_FIXTURE=$argvFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: set up Java 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: test and package Rider plugin
      shell: powershell
      working-directory: tools/rider-plugin
      run: |
        .\gradlew.bat test buildPlugin --no-daemon
        $gradleExitCode = $LASTEXITCODE
        python -B scripts/check_trust_results.py build/test-results/test/TEST-com.verseangelscript.rider.diagnostics.VasRiderTrustIntegrationTest.xml
        $trustEvidenceExitCode = $LASTEXITCODE
        python -B scripts/check_project_build_results.py build/test-results/test/TEST-com.verseangelscript.rider.projectbuild.VasRiderProjectBuildIntegrationTest.xml
        $projectEvidenceExitCode = $LASTEXITCODE
        if ($gradleExitCode -ne 0) { exit $gradleExitCode }
        if ($trustEvidenceExitCode -ne 0) { exit $trustEvidenceExitCode }
        exit $projectEvidenceExitCode

    - name: Stage validated Rider install package
      id: install_artifact
      run: python -B tools/ide-artifacts/stage.py --ide rider --output out/ide-install/rider
    - name: Upload validated Rider install package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.install_artifact.outputs.name }}
        path: ${{ steps.install_artifact.outputs.path }}
        if-no-files-found: error
        retention-days: 7

  Windows_x86-64_Clang-Cl:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
    - name: set up Clang
      uses: ilammy/msvc-dev-cmd@v1
    - name: build angelscript & test_feature
      run: |
        cd ${{github.workspace}}/sdk/tests/test_feature/projects/cmake
        cmake . -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        cmake --build . --config ${{ matrix.build_type }}
    - name: run test_feature
      run: |
        cd ${{github.workspace}}/sdk/tests/test_feature/bin
        ./test_feature.exe

  MacOS_arm64_Clang:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
    - name: build angelscript & test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/projects/cmake
        cmake .
        cmake --build . --config ${{ matrix.build_type }}
    - name: run test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        ./test_feature

  MacOS_x86-64_Clang:
    runs-on: macos-15-intel
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
    - name: build angelscript & test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/projects/cmake
        cmake .
        cmake --build . --config ${{ matrix.build_type }}
    - name: run test_feature
      run: |
        cd $GITHUB_WORKSPACE/sdk/tests/test_feature/bin
        ./test_feature

        
